<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>MINE-WEB Mobile</title>
    <style>
        /* Базовые настройки */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #111; 
            /* Современный системный шрифт */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; display: none;
        }

        /* === ПРЕДУПРЕЖДЕНИЕ ОБ ОРИЕНТАЦИИ === */
        #orientation-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: linear-gradient(135deg, #1f1f1f, #000000); color: #fff;
            display: none; justify-content: center; align-items: center; text-align: center;
            flex-direction: column;
        }
        #orientation-warning.active { display: flex; }
        .warning-content { padding: 20px; }
        #orientation-warning h1 { font-size: 28px; color: #ff4757; margin-bottom: 15px; font-weight: 800; }
        #orientation-warning p { font-size: 16px; color: #ced6e0; margin-bottom: 25px; }
        .rotate-icon { font-size: 48px; animation: rotate 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* === СОВРЕМЕННОЕ ГЛАВНОЕ МЕНЮ === */
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .menu-title {
            font-size: 48px; font-weight: 900; color: #ffffff;
            margin-bottom: 40px; letter-spacing: 2px; text-align: center;
            text-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .menu-title span { 
            display: block; font-size: 20px; color: #2ecc71; 
            font-weight: 600; letter-spacing: 5px; margin-top: 5px; text-transform: uppercase;
        }

        /* Красивая кнопка старта */
        .start-btn {
            padding: 16px 40px; border: none; border-radius: 30px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white; font-size: 18px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .start-btn:active { 
            transform: scale(0.95); 
            box-shadow: 0 5px 10px rgba(46, 204, 113, 0.2); 
        }

        /* === ИГРОВОЙ HUD (СОВРЕМЕННЫЙ СТИЛЬ СТЕКЛА) === */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; z-index: 10; pointer-events: none; display: none;
            opacity: 0.8;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; border-radius: 2px;}
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        #exit-btn {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 15; padding: 8px 20px; font-size: 12px; font-weight: bold;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 20px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            display: none;
        }

        /* Панели управления */
        #d-pad {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            display: none; grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; gap: 8px;
        }
        #action-pad {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: none; grid-template-columns: 60px 60px; gap: 12px;
        }

        /* Стиль стеклянных кнопок */
        .btn {
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 14px;
            color: #fff; display: flex; justify-content: center; align-items: center; font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
        
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 3; }
        #btn-d { grid-column: 3; grid-row: 2; }
        
        .action-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 22px; }
        #btn-jump { grid-column: 1 / span 2; height: 45px; font-size: 13px; font-weight: bold; border-radius: 12px; letter-spacing: 1px; }

        /* Инвентарь */
        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: none; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); padding: 5px; gap: 8px; border-radius: 16px;
        }
        .slot {
            width: 42px; height: 42px; background: rgba(255,255,255,0.1); 
            border: 2px solid transparent; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; font-size: 22px;
            transition: all 0.2s ease;
        }
        .slot.active { border-color: #2ecc71; background: rgba(46, 204, 113, 0.2); transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div class="warning-content">
            <h1>ПОВЕРНИТЕ УСТРОЙСТВО</h1>
            <p>Для комфортной игры перейдите<br>в горизонтальный режим.</p>
            <div class="rotate-icon">🔄</div>
        </div>
    </div>

    <div id="main-menu">
        <div class="menu-title">MINE-WEB<br><span>Mobile Edition</span></div>
        <button class="start-btn" id="play-btn">Начать игру</button>
    </div>

    <div id="crosshair"></div>
    <div id="exit-btn">В МЕНЮ</div>
    
    <div id="game-canvas"></div>

    <div id="d-pad">
        <div id="btn-w" class="btn">▲</div>
        <div id="btn-a" class="btn">◀</div>
        <div id="btn-s" class="btn">▼</div>
        <div id="btn-d" class="btn">▶</div>
    </div>

    <div id="action-pad">
        <div id="btn-build" class="btn action-btn">🧱</div>
        <div id="btn-break" class="btn action-btn">🔨</div>
        <div id="btn-jump" class="btn">ПРЫЖОК</div>
    </div>

    <div id="hotbar">
        <div class="slot active" data-block="0">🟩</div>
        <div class="slot" data-block="1">🟫</div>
        <div class="slot" data-block="2">⬜</div>
        <div class="slot" data-block="3">🟧</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === ЛОГИКА ОРИЕНТАЦИИ ===
        const warningScreen = document.getElementById('orientation-warning');
        function checkOrientation() {
            const isLandscape = window.innerWidth > window.innerHeight;
            if (!isLandscape) {
                warningScreen.classList.add('active');
            } else {
                warningScreen.classList.remove('active');
                window.dispatchEvent(new Event('resize'));
            }
        }
        window.addEventListener('DOMContentLoaded', checkOrientation);
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);

        // === ПОЛНОЭКРАННЫЙ РЕЖИМ (ФУЛСКРИН) ===
        function requestFullScreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.mozRequestFullScreen) docElm.mozRequestFullScreen();
            else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
            else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
        }

        function exitFullScreen() {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }

        // === НАСТРОЙКИ СЦЕНЫ И ОПТИМИЗАЦИИ ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.04);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Легкая оптимизация пикселей
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.5); sunLight.position.set(20, 50, 20); scene.add(sunLight);

        // === МАТЕРИАЛЫ И БЛОКИ ===
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const edgeGeo = new THREE.EdgesGeometry(blockGeometry);
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1, opacity: 0.5, transparent: true });

        const materialsMap = {
            0: [new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x5b9c31}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x866043})],
            1: Array(6).fill(new THREE.MeshLambertMaterial({color:0x866043})),
            2: Array(6).fill(new THREE.MeshLambertMaterial({color:0x7f8c8d})),
            3: Array(6).fill(new THREE.MeshLambertMaterial({color:0xd35400}))
        };

        let currentSelectedBlockType = 0;
        const worldBlocks = [];
        const mapSize = 12;

        for (let x = -mapSize; x <= mapSize; x++) {
            for (let z = -mapSize; z <= mapSize; z++) {
                createBlock(x, 0, z, 0);
            }
        }

        function createBlock(x, y, z, type) {
            const mats = materialsMap[type];
            const block = new THREE.Mesh(blockGeometry, mats);
            block.position.set(x, y, z);
            const lines = new THREE.LineSegments(edgeGeo, edgeMat);
            block.add(lines);
            scene.add(block);
            worldBlocks.push(block);
        }

        const slots = document.querySelectorAll('.slot');
        slots.forEach(slot => {
            slot.addEventListener('touchstart', (e) => {
                e.preventDefault();
                slots.forEach(s => s.classList.remove('active'));
                slot.classList.add('active');
                currentSelectedBlockType = parseInt(slot.getAttribute('data-block'));
            });
        });

        // === КАМЕРА ===
        let isDragging = false;
        let prevTouchX = 0, prevTouchY = 0;
        const canvasZone = document.getElementById('game-canvas');

        canvasZone.addEventListener('touchstart', (e) => {
            isDragging = true;
            prevTouchX = e.touches[0].clientX;
            prevTouchY = e.touches[0].clientY;
        });

        canvasZone.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - prevTouchX;
            const deltaY = e.touches[0].clientY - prevTouchY;

            if (Math.abs(deltaX) < 100 && Math.abs(deltaY) < 100) {
                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, camera.rotation.x));
            }
            prevTouchX = e.touches[0].clientX; prevTouchY = e.touches[0].clientY;
        });
        canvasZone.addEventListener('touchend', () => isDragging = false);

        // === ФИЗИКА ===
        const moveState = { forward: false, backward: false, left: false, right: false };
        let playerVelocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;
        const jumpForce = 0.25;
        const speed = 0.09;
        
        const playerRadius = 0.35;
        const playerHeight = 2.0; 
        camera.position.set(0, playerHeight, 0); 

        function bindControl(id, action) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[action] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); moveState[action] = false; });
        }
        bindControl('btn-w', 'forward'); bindControl('btn-s', 'backward');
        bindControl('btn-a', 'left'); bindControl('btn-d', 'right');

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { playerVelocityY = jumpForce; isGrounded = false; }
        });

        function checkCollisions(targetPos) {
            for (let i = 0; i < worldBlocks.length; i++) {
                const b = worldBlocks[i].position;
                if (Math.abs(b.x - targetPos.x) < 1.1 && Math.abs(b.z - targetPos.z) < 1.1 && Math.abs(b.y - (targetPos.y - 1.0)) < 1.5) {
                    const boxMinX = b.x - 0.5, boxMaxX = b.x + 0.5;
                    const boxMinZ = b.z - 0.5, boxMaxZ = b.z + 0.5;
                    const boxMinY = b.y - 0.5, boxMaxY = b.y + 0.5;

                    const closestX = Math.max(boxMinX, Math.min(targetPos.x, boxMaxX));
                    const closestZ = Math.max(boxMinZ, Math.min(targetPos.z, boxMaxZ));

                    const distX = targetPos.x - closestX;
                    const distZ = targetPos.z - closestZ;
                    
                    const pMinY = targetPos.y - playerHeight;
                    const pMaxY = targetPos.y;

                    if ((distX * distX + distZ * distZ) < (playerRadius * playerRadius) && (pMinY < boxMaxY && pMaxY > boxMinY)) {
                        return true; 
                    }
                }
            }
            return false;
        }

        // === СТРОИТЕЛЬСТВО ===
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        document.getElementById('btn-break').addEventListener('touchstart', (e) => {
            e.preventDefault();
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(worldBlocks);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const b = intersects[0].object;
                if(b.position.y === 0) return;
                scene.remove(b);
                worldBlocks.splice(worldBlocks.indexOf(b), 1);
            }
        });

        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.preventDefault();
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(worldBlocks);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];
                const spawnPos = new THREE.Vector3().copy(intersect.object.position).add(intersect.face.normal);
                
                const distToPlayer = spawnPos.distanceTo(new THREE.Vector3(camera.position.x, spawnPos.y, camera.position.z));
                if (distToPlayer > 0.7 || Math.abs(camera.position.y - spawnPos.y) > playerHeight - 0.2) {
                    createBlock(spawnPos.x, spawnPos.y, spawnPos.z, currentSelectedBlockType);
                }
            }
        });

        // === МЕНЕДЖЕР ЭКРАНОВ С ФУЛСКРИНОМ ===
        function toggleUI(inGame) {
            const state = inGame ? 'block' : 'none';
            const menuState = inGame ? 'none' : 'flex';
            document.getElementById('main-menu').style.display = menuState;
            document.getElementById('game-canvas').style.display = state;
            document.getElementById('crosshair').style.display = state;
            document.getElementById('exit-btn').style.display = state;
            document.getElementById('d-pad').style.display = inGame ? 'grid' : 'none';
            document.getElementById('action-pad').style.display = inGame ? 'grid' : 'none';
            document.getElementById('hotbar').style.display = inGame ? 'flex' : 'none';
            
            if(inGame) {
                setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
            }
        }

        document.getElementById('play-btn').addEventListener('click', () => {
            requestFullScreen(); // Запрос полного экрана при старте
            toggleUI(true);
        });
        
        document.getElementById('exit-btn').addEventListener('click', () => {
            exitFullScreen(); // Выход из полного экрана
            toggleUI(false);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === ЦИКЛ ===
        const moveDir = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            playerVelocityY += gravity;
            camera.position.y += playerVelocityY;

            let groundY = playerHeight; 
            
            for(let i=0; i<worldBlocks.length; i++) {
                let b = worldBlocks[i].position;
                if (Math.abs(b.x - camera.position.x) < 0.65 && Math.abs(b.z - camera.position.z) < 0.65) {
                    if (b.y + playerHeight > groundY && camera.position.y >= b.y + playerHeight - 0.2) {
                        groundY = b.y + playerHeight;
                    }
                }
            }

            if (camera.position.y <= groundY) {
                camera.position.y = groundY;
                playerVelocityY = 0;
                isGrounded = true;
            }

            moveDir.set(0, 0, 0);
            if (moveState.forward) moveDir.z -= 1;
            if (moveState.backward) moveDir.z += 1;
            if (moveState.left) moveDir.x -= 1;
            if (moveState.right) moveDir.x += 1;

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize();
                moveDir.applyEuler(new THREE.Euler(0, camera.rotation.y, 0));
                
                let testPosX = camera.position.clone().addScaledVector(new THREE.Vector3(moveDir.x, 0, 0), speed);
                if (!checkCollisions(testPosX)) {
                    camera.position.x = testPosX.x;
                }
                
                let testPosZ = camera.position.clone().addScaledVector(new THREE.Vector3(0, 0, moveDir.z), speed);
                if (!checkCollisions(testPosZ)) {
                    camera.position.z = testPosZ.z;
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
