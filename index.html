<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>MINE-WEB Mobile</title>
    <style>
        :root {
            --ui-bg: rgba(0, 0, 0, 0.4);
            --ui-border: rgba(255, 255, 255, 0.1);
            --ui-blur: 2px;
            --ui-color: #fff;
        }

        /* Светлая тема - Liquid Glass */
        body.theme-light {
            --ui-bg: rgba(255, 255, 255, 0.2);
            --ui-border: rgba(255, 255, 255, 0.4);
            --ui-blur: 10px;
            --ui-color: #f0f0f0;
        }

        /* Темная тема - Оптимизированная */
        body.theme-dark {
            --ui-bg: rgba(15, 15, 15, 0.6);
            --ui-border: rgba(50, 50, 50, 0.5);
            --ui-blur: 0px;
            --ui-color: #ddd;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }

        /* Предупреждение об ориентации */
        #orientation-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: #111; color: #fff; display: none; justify-content: center; align-items: center; text-align: center; flex-direction: column;
        }
        #orientation-warning.active { display: flex; }

        /* Окна меню (Главное, Пауза, Настройки) */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: url('https://images.unsplash.com/photo-1606037150583-fb80ac72b834?q=80&w=1000&auto=format&fit=crop') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .menu-overlay::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: -1; }
        
        #pause-menu, #settings-menu { background: rgba(0,0,0,0.8); display: none; }

        .menu-title { font-size: 40px; font-weight: bold; color: #fff; margin-bottom: 30px; text-shadow: 2px 2px 0 #000; text-align: center; }
        
        .menu-btn {
            width: 250px; padding: 12px; margin: 8px; border: 2px solid #555; background: rgba(50, 50, 50, 0.8);
            color: white; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase;
        }
        .menu-btn:active { background: rgba(100, 100, 100, 0.8); }
        .menu-btn.green { background: #2e7d32; border-color: #1b5e20; }

        /* Настройки */
        .settings-block { margin-bottom: 20px; text-align: center; color: white; width: 250px; }
        .settings-block label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type=range] { width: 100%; }

        /* Игровой HUD */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 14px; height: 14px; z-index: 10; pointer-events: none; display: none; opacity: 0.7;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        #pause-btn-hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 15; padding: 5px 15px; font-size: 12px; font-weight: bold;
            background: var(--ui-bg); border: 1px solid var(--ui-border); color: white; border-radius: 8px;
            display: none; backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
        }

        /* Управление */
        #d-pad { position: absolute; bottom: 20px; left: 20px; z-index: 10; display: none; grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; gap: 5px; }
        #action-pad { position: absolute; bottom: 20px; right: 20px; z-index: 10; display: none; grid-template-columns: 60px 60px; gap: 10px; }

        .btn {
            background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 12px;
            color: var(--ui-color); display: flex; justify-content: center; align-items: center; font-size: 20px;
            backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); }
        
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 3; }
        #btn-d { grid-column: 3; grid-row: 2; }
        
        .action-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 24px; }
        #btn-jump { grid-column: 1 / span 2; height: 40px; font-size: 12px; font-weight: bold; }

        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: none; background: var(--ui-bg); padding: 5px; gap: 5px; border-radius: 8px;
            backdrop-filter: blur(var(--ui-blur)); border: 1px solid var(--ui-border);
        }
        .slot {
            width: 40px; height: 40px; background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 6px;
            display: flex; justify-content: center; align-items: center; font-size: 20px;
        }
        .slot.active { border-color: #fff; background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="theme-light"> <div id="orientation-warning"><h2>Поверните телефон горизонтально</h2></div>

    <div id="main-menu" class="menu-overlay">
        <div class="menu-title">MINE-WEB<br><span style="font-size: 16px; color: #aaa;">MOBILE EDITION</span></div>
        <button class="menu-btn green" id="btn-start-game">Начать игру</button>
        <button class="menu-btn" id="btn-main-settings">Настройки</button>
    </div>

    <div id="pause-menu" class="menu-overlay">
        <div class="menu-title">ПАУЗА</div>
        <button class="menu-btn green" id="btn-resume">Продолжить</button>
        <button class="menu-btn" id="btn-pause-settings">Настройки</button>
        <button class="menu-btn" id="btn-exit-main" style="background:#c62828;">В главное меню</button>
    </div>

    <div id="settings-menu" class="menu-overlay">
        <div class="menu-title">НАСТРОЙКИ</div>
        
        <div class="settings-block">
            <label>Дальность прорисовки: <span id="render-dist-val">10</span></label>
            <input type="range" id="render-dist-slider" min="6" max="16" value="10">
        </div>

        <div class="settings-block">
            <label>Дизайн интерфейса</label>
            <button class="menu-btn" id="btn-toggle-theme" style="width:100%; font-size:14px;">Тема: СВЕТЛАЯ (Стекло)</button>
        </div>

        <button class="menu-btn green" id="btn-close-settings" style="margin-top: 20px;">Готово</button>
    </div>

    <div id="crosshair"></div>
    <div id="pause-btn-hud">|| ПАУЗА</div>
    <div id="game-canvas"></div>

    <div id="d-pad">
        <div id="btn-w" class="btn">▲</div>
        <div id="btn-a" class="btn">◀</div>
        <div id="btn-s" class="btn">▼</div>
        <div id="btn-d" class="btn">▶</div>
    </div>

    <div id="action-pad">
        <div id="btn-build" class="btn action-btn">🧱</div>
        <div id="btn-break" class="btn action-btn">🔨</div>
        <div id="btn-jump" class="btn">ПРЫЖОК</div>
    </div>

    <div id="hotbar">
        <div class="slot active" data-block="0">🟩</div> <div class="slot" data-block="1">🟫</div> <div class="slot" data-block="2">⬜</div> <div class="slot" data-block="3">🪵</div> <div class="slot" data-block="4">🍃</div> <div class="slot" data-block="5">🧱</div> </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === БАЗА ===
        let renderDistance = 10;
        let isGameRunning = false;
        let currentTheme = 'light';

        function goFullscreen() {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
        }

        // === ОРИЕНТАЦИЯ ===
        function checkOrientation() {
            if (window.innerWidth < window.innerHeight) {
                document.getElementById('orientation-warning').classList.add('active');
            } else {
                document.getElementById('orientation-warning').classList.remove('active');
            }
        }
        window.addEventListener('resize', checkOrientation); setInterval(checkOrientation, 1000); checkOrientation();

        // === НАВИГАЦИЯ ПО МЕНЮ ===
        const ui = {
            main: document.getElementById('main-menu'),
            pause: document.getElementById('pause-menu'),
            settings: document.getElementById('settings-menu'),
            hud: [document.getElementById('crosshair'), document.getElementById('pause-btn-hud'), document.getElementById('d-pad'), document.getElementById('action-pad'), document.getElementById('hotbar'), document.getElementById('game-canvas')]
        };

        function showScreen(screenName) {
            ui.main.style.display = 'none'; ui.pause.style.display = 'none'; ui.settings.style.display = 'none';
            ui.hud.forEach(el => el.style.display = 'none');
            
            if(screenName === 'game') {
                ui.hud.forEach(el => el.style.display = ''); 
                ui.hud[2].style.display = 'grid'; ui.hud[3].style.display = 'grid'; ui.hud[4].style.display = 'flex';
                isGameRunning = true; window.dispatchEvent(new Event('resize'));
            } else {
                isGameRunning = false;
                if(screenName === 'main') ui.main.style.display = 'flex';
                if(screenName === 'pause') ui.pause.style.display = 'flex';
                if(screenName === 'settings') ui.settings.style.display = 'flex';
            }
        }

        document.getElementById('btn-start-game').onclick = () => { goFullscreen(); showScreen('game'); };
        document.getElementById('pause-btn-hud').onclick = () => showScreen('pause');
        document.getElementById('btn-resume').onclick = () => { goFullscreen(); showScreen('game'); };
        document.getElementById('btn-exit-main').onclick = () => showScreen('main');
        
        let previousMenu = 'main';
        document.getElementById('btn-main-settings').onclick = () => { previousMenu = 'main'; showScreen('settings'); };
        document.getElementById('btn-pause-settings').onclick = () => { previousMenu = 'pause'; showScreen('settings'); };
        document.getElementById('btn-close-settings').onclick = () => showScreen(previousMenu);

        // Настройки логика
        document.getElementById('render-dist-slider').oninput = (e) => {
            renderDistance = parseInt(e.target.value);
            document.getElementById('render-dist-val').innerText = renderDistance;
            scene.fog.near = renderDistance - 4; scene.fog.far = renderDistance + 2;
        };

        document.getElementById('btn-toggle-theme').onclick = (e) => {
            if(currentTheme === 'light') { currentTheme = 'dark'; document.body.className = 'theme-dark'; e.target.innerText = 'Тема: ТЕМНАЯ (Оптим.)'; }
            else { currentTheme = 'light'; document.body.className = 'theme-light'; e.target.innerText = 'Тема: СВЕТЛАЯ (Стекло)'; }
        };

        // === SCENE & THREE.JS ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, renderDistance - 4, renderDistance + 2);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.4); sunLight.position.set(20, 50, 20); scene.add(sunLight);

        // === БЛОКИ ===
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const mats = {
            0: [new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x4caf50}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b})], // Трава
            1: Array(6).fill(new THREE.MeshLambertMaterial({color:0x8b5a2b})), // Земля
            2: Array(6).fill(new THREE.MeshLambertMaterial({color:0x7f8c8d})), // Камень
            3: [new THREE.MeshLambertMaterial({color:0x5c4033}), new THREE.MeshLambertMaterial({color:0x5c4033}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x5c4033}), new THREE.MeshLambertMaterial({color:0x5c4033})], // Дерево
            4: Array(6).fill(new THREE.MeshLambertMaterial({color:0x2e7d32, transparent: true, opacity: 0.9})), // Листва
            5: Array(6).fill(new THREE.MeshLambertMaterial({color:0xc0392b}))  // Кирпич
        };

        const blockMap = new Map();
        let currentBlockType = 0;

        function createBlock(x, y, z, type, isPlayerBuilt = false) {
            const key = `${x},${y},${z}`;
            if (blockMap.has(key)) return;

            const block = new THREE.Mesh(blockGeo, mats[type]);
            block.position.set(x, y, z);
            block.isPlayerBuilt = isPlayerBuilt; // Чтобы не удалять постройки игрока
            
            scene.add(block);
            blockMap.set(key, block);
        }

        // Хотбар
        const slots = document.querySelectorAll('.slot');
        slots.forEach(slot => {
            slot.addEventListener('touchstart', (e) => {
                e.preventDefault(); slots.forEach(s => s.classList.remove('active'));
                slot.classList.add('active'); currentBlockType = parseInt(slot.getAttribute('data-block'));
            });
        });

        // === ГЕНЕРАЦИЯ И ОПТИМИЗАЦИЯ ЛАНДШАФТА ===
        function getTerrainHeight(x, z) {
            // Простая математическая генерация холмов (шум)
            return Math.floor(Math.sin(x / 6) * 3 + Math.cos(z / 5) * 2);
        }

        function generateAndUnloadChunks() {
            if(!isGameRunning) return;
            const pX = Math.round(camera.position.x);
            const pZ = Math.round(camera.position.z);
            
            // 1. Генерация новых
            let added = 0;
            for(let x = pX - renderDistance; x <= pX + renderDistance; x++) {
                for(let z = pZ - renderDistance; z <= pZ + renderDistance; z++) {
                    if (Math.hypot(x - pX, z - pZ) <= renderDistance) {
                        const h = getTerrainHeight(x, z);
                        const key = `${x},${h},${z}`;
                        if(!blockMap.has(key)) {
                            createBlock(x, h, z, 0); // Трава
                            createBlock(x, h-1, z, 1); // Земля
                            createBlock(x, h-2, z, 2); // Камень
                            added++;
                            if(added > 10) return; // Чтобы не лагало
                        }
                    }
                }
            }

            // 2. Удаление старых (ОПТИМИЗАЦИЯ ПАМЯТИ)
            // Раз в секунду чистим карту
        }
        setInterval(() => {
            if(!isGameRunning) return;
            const pX = Math.round(camera.position.x);
            const pZ = Math.round(camera.position.z);
            for (let [key, block] of blockMap.entries()) {
                if(block.isPlayerBuilt) continue; // Не удаляем то, что построил игрок
                if (Math.hypot(block.position.x - pX, block.position.z - pZ) > renderDistance + 3) {
                    scene.remove(block);
                    blockMap.delete(key);
                }
            }
        }, 1000);

        // === ИСПРАВЛЕННЫЙ МУЛЬТИТАЧ (ХОДЬБА + КАМЕРА) ===
        let cameraTouchId = null;
        let prevX = 0, prevY = 0;
        const canvasZone = document.getElementById('game-canvas');

        canvasZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(cameraTouchId === null) {
                    cameraTouchId = e.changedTouches[i].identifier;
                    prevX = e.changedTouches[i].clientX; prevY = e.changedTouches[i].clientY;
                }
            }
        }, {passive: false});

        canvasZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === cameraTouchId) {
                    const deltaX = e.changedTouches[i].clientX - prevX;
                    const deltaY = e.changedTouches[i].clientY - prevY;
                    camera.rotation.y -= deltaX * 0.005;
                    camera.rotation.x -= deltaY * 0.005;
                    camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, camera.rotation.x));
                    prevX = e.changedTouches[i].clientX; prevY = e.changedTouches[i].clientY;
                }
            }
        }, {passive: false});

        canvasZone.addEventListener('touchend', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === cameraTouchId) cameraTouchId = null;
            }
        });
        canvasZone.addEventListener('touchcancel', () => cameraTouchId = null);

        // === ФИЗИКА И УПРАВЛЕНИЕ ===
        const moveState = { forward: false, backward: false, left: false, right: false };
        let velY = 0; let isGrounded = true; const gravity = -0.015; const jumpForce = 0.22; const speed = 0.09;
        const playerRadius = 0.3; const playerHeight = 1.8;
        camera.position.set(0, 10, 0); // Спавн повыше, чтобы упасть на ландшафт

        function bindBtn(id, act) {
            const el = document.getElementById(id);
            // Важно! Останавливаем всплытие, чтобы не триггерило камеру
            el.addEventListener('touchstart', (e) => { e.stopPropagation(); moveState[act] = true; });
            el.addEventListener('touchend', (e) => { e.stopPropagation(); moveState[act] = false; });
            el.addEventListener('touchcancel', (e) => { e.stopPropagation(); moveState[act] = false; });
        }
        bindBtn('btn-w', 'forward'); bindBtn('btn-s', 'backward');
        bindBtn('btn-a', 'left'); bindBtn('btn-d', 'right');

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.stopPropagation(); if (isGrounded) { velY = jumpForce; isGrounded = false; }
        });

        function checkCol(pos) {
            const pMinX = pos.x - playerRadius, pMaxX = pos.x + playerRadius;
            const pMinZ = pos.z - playerRadius, pMaxZ = pos.z + playerRadius;
            const pMinY = pos.y - playerHeight + 0.05, pMaxY = pos.y; 

            const minX = Math.floor(pMinX), maxX = Math.floor(pMaxX);
            const minZ = Math.floor(pMinZ), maxZ = Math.floor(pMaxZ);
            const minY = Math.floor(pMinY), maxY = Math.floor(pMaxY);

            for(let x = minX; x <= maxX; x++) {
                for(let y = minY; y <= maxY; y++) {
                    for(let z = minZ; z <= maxZ; z++) {
                        if(blockMap.has(`${x},${y},${z}`)) {
                            if (pMinX < x+0.5 && pMaxX > x-0.5 && pMinZ < z+0.5 && pMaxZ > z-0.5 && pMinY < y+0.5 && pMaxY > y-0.5) return true;
                        }
                    }
                }
            }
            return false;
        }

        // Строительство
        const raycaster = new THREE.Raycaster();
        document.getElementById('btn-break').addEventListener('touchstart', (e) => {
            e.stopPropagation();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blockMap.values()));
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const b = intersects[0].object;
                scene.remove(b); blockMap.delete(`${b.position.x},${b.position.y},${b.position.z}`);
            }
        });
        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.stopPropagation();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blockMap.values()));
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const pos = new THREE.Vector3().copy(intersects[0].object.position).add(intersects[0].face.normal);
                if(pos.distanceTo(camera.position) > 0.8 || pos.y < camera.position.y - playerHeight) {
                    createBlock(pos.x, pos.y, pos.z, currentBlockType, true); // true = игрок построил
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === ЦИКЛ ===
        const moveDir = new THREE.Vector3();
        function animate() {
            requestAnimationFrame(animate);
            if(!isGameRunning) return;

            generateAndUnloadChunks();

            velY += gravity; camera.position.y += velY;
            let highestY = -Infinity;
            const cMinX = Math.round(camera.position.x - playerRadius), cMaxX = Math.round(camera.position.x + playerRadius);
            const cMinZ = Math.round(camera.position.z - playerRadius), cMaxZ = Math.round(camera.position.z + playerRadius);

            for(let x = cMinX; x <= cMaxX; x++) {
                for(let z = cMinZ; z <= cMaxZ; z++) {
                    for(let y = Math.floor(camera.position.y); y >= -10; y--) {
                        if(blockMap.has(`${x},${y},${z}`)) {
                            if(y + 0.5 <= camera.position.y - playerHeight + 0.3) {
                                if(y + 0.5 > highestY) highestY = y + 0.5;
                            } break;
                        }
                    }
                }
            }

            let ground = highestY !== -Infinity ? highestY : -10;
            if (camera.position.y <= ground + playerHeight) { camera.position.y = ground + playerHeight; velY = 0; isGrounded = true; }

            moveDir.set(0, 0, 0);
            if (moveState.forward) moveDir.z -= 1; if (moveState.backward) moveDir.z += 1;
            if (moveState.left) moveDir.x -= 1; if (moveState.right) moveDir.x += 1;

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize(); moveDir.applyEuler(new THREE.Euler(0, camera.rotation.y, 0));
                let testX = camera.position.clone().addScaledVector(new THREE.Vector3(moveDir.x, 0, 0), speed);
                if (!checkCol(testX)) camera.position.x = testX.x;
                let testZ = camera.position.clone().addScaledVector(new THREE.Vector3(0, 0, moveDir.z), speed);
                if (!checkCol(testZ)) camera.position.z = testZ.z;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
