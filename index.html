<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>MINE-WEB Mobile</title>
    <style>
        /* === ТЕМЫ ИНТЕРФЕЙСА === */
        :root {
            --ui-bg: rgba(0, 0, 0, 0.4);
            --ui-border: rgba(255, 255, 255, 0.1);
            --ui-blur: 4px;
            --ui-color: #fff;
            --menu-bg: #111;
        }

        body.theme-light {
            --ui-bg: rgba(255, 255, 255, 0.3);
            --ui-border: rgba(255, 255, 255, 0.6);
            --ui-blur: 15px;
            --ui-color: #111;
            --menu-bg: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover;
        }

        body.theme-dark {
            --ui-bg: rgba(15, 15, 15, 0.65);
            --ui-border: rgba(80, 80, 80, 0.5);
            --ui-blur: 2px; /* Меньше размытия для ФПС */
            --ui-color: #f0f0f0;
            --menu-bg: url('https://images.unsplash.com/photo-1606037150583-fb80ac72b834?q=80&w=1000&auto=format&fit=crop') center/cover;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* Игровой холст (Теперь точно будет виден!) */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }

        /* Предупреждение об ориентации */
        #orientation-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: #111; color: #fff; display: none; justify-content: center; align-items: center; text-align: center;
        }
        @media (orientation: portrait) { #orientation-warning { display: flex !important; } }

        /* === КРАСИВЫЕ МЕНЮ (Liquid Glass) === */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: var(--menu-bg);
            display: none; justify-content: center; align-items: center;
        }
        
        .menu-card {
            background: var(--ui-bg);
            backdrop-filter: blur(var(--ui-blur));
            -webkit-backdrop-filter: blur(var(--ui-blur));
            border: 1px solid var(--ui-border);
            padding: 30px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            width: 300px;
        }

        .menu-title { font-size: 32px; font-weight: 800; color: var(--ui-color); margin-bottom: 20px; letter-spacing: 1px; }
        .menu-title span { font-size: 14px; font-weight: normal; opacity: 0.7; display: block; margin-top: -5px; }
        
        .menu-btn {
            width: 100%; padding: 14px; margin-top: 12px;
            background: rgba(100, 100, 100, 0.2);
            border: 1px solid var(--ui-border);
            color: var(--ui-color); font-size: 16px; font-weight: bold;
            border-radius: 12px; cursor: pointer; transition: 0.1s; text-transform: uppercase;
        }
        body.theme-light .menu-btn { background: rgba(255, 255, 255, 0.5); }
        .menu-btn:active { transform: scale(0.96); }
        
        .menu-btn.green { background: #388E3C; color: white; border: none; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .menu-btn.green:active { background: #2E7D32; }
        .menu-btn.red { background: #D32F2F; color: white; border: none; }

        /* Настройки */
        .settings-block { margin-bottom: 20px; text-align: left; color: var(--ui-color); }
        .settings-block label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: #388E3C; }

        /* === ИГРОВОЙ ИНТЕРФЕЙС === */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; z-index: 10; pointer-events: none; display: none; opacity: 0.8;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; box-shadow: 0 0 2px black; }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #pause-btn-hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 15; padding: 6px 20px; font-size: 12px; font-weight: bold; letter-spacing: 1px;
            background: var(--ui-bg); border: 1px solid var(--ui-border); color: var(--ui-color); border-radius: 20px;
            display: none; backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
        }

        #d-pad { position: absolute; bottom: 20px; left: 20px; z-index: 10; display: none; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 6px; }
        #action-pad { position: absolute; bottom: 20px; right: 20px; z-index: 10; display: none; grid-template-columns: 65px 65px; gap: 10px; }

        .btn {
            background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 16px;
            color: var(--ui-color); display: flex; justify-content: center; align-items: center; font-size: 24px;
            backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active { background: rgba(150, 150, 150, 0.4); transform: scale(0.95); }
        
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 3; }
        #btn-d { grid-column: 3; grid-row: 2; }
        
        .action-btn { width: 65px; height: 65px; border-radius: 50%; font-size: 28px; }
        #btn-jump { grid-column: 1 / span 2; height: 45px; font-size: 14px; font-weight: bold; border-radius: 12px; }

        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: none; background: var(--ui-bg); padding: 6px; gap: 6px; border-radius: 12px;
            backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
            border: 1px solid var(--ui-border);
        }
        .slot {
            width: 42px; height: 42px; background: rgba(0,0,0,0.2); border: 2px solid transparent; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; font-size: 22px; transition: 0.1s;
        }
        body.theme-light .slot { background: rgba(255,255,255,0.3); }
        .slot.active { border-color: #388E3C; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="theme-light"> <div id="orientation-warning"><h2>Поверните телефон горизонтально</h2></div>

    <div id="main-menu" class="menu-overlay" style="display: flex;">
        <div class="menu-card">
            <div class="menu-title">MINE-WEB<span>MOBILE EDITION</span></div>
            <button class="menu-btn green" id="btn-start-game">Начать игру</button>
            <button class="menu-btn" id="btn-main-settings">Настройки</button>
        </div>
    </div>

    <div id="pause-menu" class="menu-overlay">
        <div class="menu-card">
            <div class="menu-title">ПАУЗА</div>
            <button class="menu-btn green" id="btn-resume">Продолжить</button>
            <button class="menu-btn" id="btn-pause-settings">Настройки</button>
            <button class="menu-btn red" id="btn-exit-main">В главное меню</button>
        </div>
    </div>

    <div id="settings-menu" class="menu-overlay">
        <div class="menu-card">
            <div class="menu-title">НАСТРОЙКИ</div>
            <div class="settings-block">
                <label>Дальность прорисовки: <span id="render-dist-val">10</span></label>
                <input type="range" id="render-dist-slider" min="6" max="16" value="10">
            </div>
            <div class="settings-block">
                <label>Дизайн интерфейса</label>
                <button class="menu-btn" id="btn-toggle-theme">СВЕТЛАЯ (Liquid Glass)</button>
            </div>
            <button class="menu-btn green" id="btn-close-settings" style="margin-top: 10px;">Готово</button>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="pause-btn-hud">|| ПАУЗА</div>
    <div id="game-canvas"></div> <div id="d-pad">
        <div id="btn-w" class="btn">▲</div>
        <div id="btn-a" class="btn">◀</div>
        <div id="btn-s" class="btn">▼</div>
        <div id="btn-d" class="btn">▶</div>
    </div>

    <div id="action-pad">
        <div id="btn-build" class="btn action-btn">🧱</div>
        <div id="btn-break" class="btn action-btn">🔨</div>
        <div id="btn-jump" class="btn">ПРЫЖОК</div>
    </div>

    <div id="hotbar">
        <div class="slot active" data-block="0">🟩</div>
        <div class="slot" data-block="1">🟫</div>
        <div class="slot" data-block="2">⬜</div>
        <div class="slot" data-block="3">🪵</div>
        <div class="slot" data-block="4">🍃</div>
        <div class="slot" data-block="5">🧱</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === БАЗА И НАВИГАЦИЯ ===
        let renderDistance = 10;
        let isGameRunning = false;
        let currentTheme = 'light';

        function goFullscreen() {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
        }

        const ui = {
            main: document.getElementById('main-menu'),
            pause: document.getElementById('pause-menu'),
            settings: document.getElementById('settings-menu'),
            hud: [
                document.getElementById('crosshair'), 
                document.getElementById('pause-btn-hud'), 
                document.getElementById('d-pad'), 
                document.getElementById('action-pad'), 
                document.getElementById('hotbar'), 
                document.getElementById('game-canvas') // Индекс 5!
            ]
        };

        function showScreen(screenName) {
            // Сначала жестко скрываем всё
            ui.main.style.display = 'none';
            ui.pause.style.display = 'none';
            ui.settings.style.display = 'none';
            ui.hud.forEach(el => el.style.display = 'none');
            
            if(screenName === 'game') {
                // ВОТ ТУТ БЫЛА ОШИБКА. Теперь мы задаем конкретный display для каждого элемента.
                ui.hud[0].style.display = 'block'; // прицел
                ui.hud[1].style.display = 'block'; // кнопка паузы
                ui.hud[2].style.display = 'grid';  // крестовина
                ui.hud[3].style.display = 'grid';  // действия
                ui.hud[4].style.display = 'flex';  // хотбар
                ui.hud[5].style.display = 'block'; // ИГРОВОЙ ХОЛСТ (теперь он точно виден!)
                
                isGameRunning = true; 
                window.dispatchEvent(new Event('resize')); // Фикс черного экрана при разворачивании
            } else {
                isGameRunning = false;
                if(screenName === 'main') ui.main.style.display = 'flex';
                if(screenName === 'pause') ui.pause.style.display = 'flex';
                if(screenName === 'settings') ui.settings.style.display = 'flex';
            }
        }

        // Кнопки меню
        document.getElementById('btn-start-game').onclick = () => { goFullscreen(); showScreen('game'); };
        document.getElementById('pause-btn-hud').onclick = () => showScreen('pause');
        document.getElementById('btn-resume').onclick = () => { goFullscreen(); showScreen('game'); };
        document.getElementById('btn-exit-main').onclick = () => showScreen('main');
        
        let previousMenu = 'main';
        document.getElementById('btn-main-settings').onclick = () => { previousMenu = 'main'; showScreen('settings'); };
        document.getElementById('btn-pause-settings').onclick = () => { previousMenu = 'pause'; showScreen('settings'); };
        document.getElementById('btn-close-settings').onclick = () => showScreen(previousMenu);

        // Настройки логика
        document.getElementById('render-dist-slider').oninput = (e) => {
            renderDistance = parseInt(e.target.value);
            document.getElementById('render-dist-val').innerText = renderDistance;
            scene.fog.near = renderDistance - 4; scene.fog.far = renderDistance + 2;
        };

        document.getElementById('btn-toggle-theme').onclick = (e) => {
            if(currentTheme === 'light') { 
                currentTheme = 'dark'; 
                document.body.className = 'theme-dark'; 
                e.target.innerText = 'ТЁМНАЯ (Оптимизированная)'; 
            } else { 
                currentTheme = 'light'; 
                document.body.className = 'theme-light'; 
                e.target.innerText = 'СВЕТЛАЯ (Liquid Glass)'; 
            }
        };

        // === THREE.JS И СЦЕНА ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, renderDistance - 4, renderDistance + 2);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85); scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.3); sunLight.position.set(20, 50, 20); scene.add(sunLight);

        // === БЛОКИ И ИНВЕНТАРЬ ===
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const mats = {
            0: [new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x4caf50}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b})],
            1: Array(6).fill(new THREE.MeshLambertMaterial({color:0x8b5a2b})),
            2: Array(6).fill(new THREE.MeshLambertMaterial({color:0x7f8c8d})),
            3: [new THREE.MeshLambertMaterial({color:0x5c4033}), new THREE.MeshLambertMaterial({color:0x5c4033}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x8b5a2b}), new THREE.MeshLambertMaterial({color:0x5c4033}), new THREE.MeshLambertMaterial({color:0x5c4033})],
            4: Array(6).fill(new THREE.MeshLambertMaterial({color:0x2e7d32, transparent: true, opacity: 0.85})),
            5: Array(6).fill(new THREE.MeshLambertMaterial({color:0xc0392b}))
        };

        const blockMap = new Map();
        let currentBlockType = 0;

        function createBlock(x, y, z, type, isPlayerBuilt = false) {
            const key = `${x},${y},${z}`;
            if (blockMap.has(key)) return;
            const block = new THREE.Mesh(blockGeo, mats[type]);
            block.position.set(x, y, z);
            block.isPlayerBuilt = isPlayerBuilt; 
            scene.add(block); blockMap.set(key, block);
        }

        const slots = document.querySelectorAll('.slot');
        slots.forEach(slot => {
            slot.addEventListener('touchstart', (e) => {
                e.preventDefault(); slots.forEach(s => s.classList.remove('active'));
                slot.classList.add('active'); currentBlockType = parseInt(slot.getAttribute('data-block'));
            });
        });

        // === ГЕНЕРАЦИЯ И ОЧИСТКА ПАМЯТИ ===
        function getTerrainHeight(x, z) {
            return Math.floor(Math.sin(x / 8) * 2 + Math.cos(z / 6) * 2);
        }

        function generateAndUnloadChunks() {
            if(!isGameRunning) return;
            const pX = Math.round(camera.position.x);
            const pZ = Math.round(camera.position.z);
            
            let added = 0;
            for(let x = pX - renderDistance; x <= pX + renderDistance; x++) {
                for(let z = pZ - renderDistance; z <= pZ + renderDistance; z++) {
                    if (Math.hypot(x - pX, z - pZ) <= renderDistance) {
                        const h = getTerrainHeight(x, z);
                        const key = `${x},${h},${z}`;
                        if(!blockMap.has(key)) {
                            createBlock(x, h, z, 0); 
                            createBlock(x, h-1, z, 1);
                            added++;
                            if(added > 8) return; // Плавная генерация без фризов
                        }
                    }
                }
            }
        }

        setInterval(() => {
            if(!isGameRunning) return;
            const pX = Math.round(camera.position.x);
            const pZ = Math.round(camera.position.z);
            for (let [key, block] of blockMap.entries()) {
                if(block.isPlayerBuilt) continue; 
                if (Math.hypot(block.position.x - pX, block.position.z - pZ) > renderDistance + 4) {
                    scene.remove(block); blockMap.delete(key);
                }
            }
        }, 1500);

        // === МУЛЬТИТАЧ (Бег + Камера) ===
        let cameraTouchId = null;
        let prevX = 0, prevY = 0;
        const canvasZone = document.getElementById('game-canvas');

        canvasZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(cameraTouchId === null) {
                    cameraTouchId = e.changedTouches[i].identifier;
                    prevX = e.changedTouches[i].clientX; prevY = e.changedTouches[i].clientY;
                }
            }
        }, {passive: false});

        canvasZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === cameraTouchId) {
                    const deltaX = e.changedTouches[i].clientX - prevX;
                    const deltaY = e.changedTouches[i].clientY - prevY;
                    camera.rotation.y -= deltaX * 0.005;
                    camera.rotation.x -= deltaY * 0.005;
                    camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, camera.rotation.x));
                    prevX = e.changedTouches[i].clientX; prevY = e.changedTouches[i].clientY;
                }
            }
        }, {passive: false});

        canvasZone.addEventListener('touchend', (e) => {
            for(let i=0; i<e.changedTouches.length; i++) {
                if(e.changedTouches[i].identifier === cameraTouchId) cameraTouchId = null;
            }
        });
        canvasZone.addEventListener('touchcancel', () => cameraTouchId = null);

        // === УПРАВЛЕНИЕ И ФИЗИКА ==
        const moveState = { forward: false, backward: false, left: false, right: false };
        let velY = 0; let isGrounded = true; const gravity = -0.015; const jumpForce = 0.22; const speed = 0.1;
        const playerRadius = 0.3; const playerHeight = 1.8;
        camera.position.set(0, 15, 0); // Спавн в воздухе, плавно упадет на землю

        function bindBtn(id, act) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.stopPropagation(); moveState[act] = true; });
            el.addEventListener('touchend', (e) => { e.stopPropagation(); moveState[act] = false; });
            el.addEventListener('touchcancel', (e) => { e.stopPropagation(); moveState[act] = false; });
        }
        bindBtn('btn-w', 'forward'); bindBtn('btn-s', 'backward');
        bindBtn('btn-a', 'left'); bindBtn('btn-d', 'right');

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.stopPropagation(); if (isGrounded) { velY = jumpForce; isGrounded = false; }
        });

        function checkCol(pos) {
            const pMinX = pos.x - playerRadius, pMaxX = pos.x + playerRadius;
            const pMinZ = pos.z - playerRadius, pMaxZ = pos.z + playerRadius;
            const pMinY = pos.y - playerHeight + 0.05, pMaxY = pos.y; 

            const minX = Math.floor(pMinX), maxX = Math.floor(pMaxX);
            const minZ = Math.floor(pMinZ), maxZ = Math.floor(pMaxZ);
            const minY = Math.floor(pMinY), maxY = Math.floor(pMaxY);

            for(let x = minX; x <= maxX; x++) {
                for(let y = minY; y <= maxY; y++) {
                    for(let z = minZ; z <= maxZ; z++) {
                        if(blockMap.has(`${x},${y},${z}`)) {
                            if (pMinX < x+0.5 && pMaxX > x-0.5 && pMinZ < z+0.5 && pMaxZ > z-0.5 && pMinY < y+0.5 && pMaxY > y-0.5) return true;
                        }
                    }
                }
            }
            return false;
        }

        // Строительство
        const raycaster = new THREE.Raycaster();
        document.getElementById('btn-break').addEventListener('touchstart', (e) => {
            e.stopPropagation();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blockMap.values()));
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const b = intersects[0].object;
                scene.remove(b); blockMap.delete(`${b.position.x},${b.position.y},${b.position.z}`);
            }
        });
        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.stopPropagation();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blockMap.values()));
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const pos = new THREE.Vector3().copy(intersects[0].object.position).add(intersects[0].face.normal);
                if(pos.distanceTo(camera.position) > 0.8 || pos.y < camera.position.y - playerHeight) {
                    createBlock(pos.x, pos.y, pos.z, currentBlockType, true);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === ИГРОВОЙ ЦИКЛ ===
        const moveDir = new THREE.Vector3();
        function animate() {
            requestAnimationFrame(animate);
            if(!isGameRunning) return;

            generateAndUnloadChunks();

            velY += gravity; camera.position.y += velY;
            let highestY = -Infinity;
            const cMinX = Math.round(camera.position.x - playerRadius), cMaxX = Math.round(camera.position.x + playerRadius);
            const cMinZ = Math.round(camera.position.z - playerRadius), cMaxZ = Math.round(camera.position.z + playerRadius);

            for(let x = cMinX; x <= cMaxX; x++) {
                for(let z = cMinZ; z <= cMaxZ; z++) {
                    for(let y = Math.floor(camera.position.y); y >= -15; y--) {
                        if(blockMap.has(`${x},${y},${z}`)) {
                            if(y + 0.5 <= camera.position.y - playerHeight + 0.3) {
                                if(y + 0.5 > highestY) highestY = y + 0.5;
                            } break;
                        }
                    }
                }
            }

            let ground = highestY !== -Infinity ? highestY : -15;
            if (camera.position.y <= ground + playerHeight) { 
                camera.position.y = ground + playerHeight; 
                velY = 0; 
                isGrounded = true; 
            }

            moveDir.set(0, 0, 0);
            if (moveState.forward) moveDir.z -= 1; if (moveState.backward) moveDir.z += 1;
            if (moveState.left) moveDir.x -= 1; if (moveState.right) moveDir.x += 1;

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize(); moveDir.applyEuler(new THREE.Euler(0, camera.rotation.y, 0));
                let testX = camera.position.clone().addScaledVector(new THREE.Vector3(moveDir.x, 0, 0), speed);
                if (!checkCol(testX)) camera.position.x = testX.x;
                let testZ = camera.position.clone().addScaledVector(new THREE.Vector3(0, 0, moveDir.z), speed);
                if (!checkCol(testZ)) camera.position.z = testZ.z;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
