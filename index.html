<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>MINE-WEB Mobile FIX</title>
    <style>
        :root {
            --ui-bg: rgba(255, 255, 255, 0.25);
            --ui-border: rgba(255, 255, 255, 0.4);
            --ui-blur: 12px;
            --ui-color: #f0f0f0;
            --menu-bg: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #111; font-family: system-ui, -apple-system, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }

        /* Предупреждение об ориентации */
        #orientation-warning {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: #111; color: #fff; display: none; justify-content: center; align-items: center; text-align: center;
            flex-direction: column;
        }
        #orientation-warning.active { display: flex; }

        /* === КРАСИВЫЕ "ЖИДКОЕ СТЕКЛО" МЕНЮ === */
        .menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
            background: var(--menu-bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        .menu-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }

        #pause-menu, #settings-menu { display: none; }

        .menu-title { font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 30px; letter-spacing: 2px; }
        .menu-title span { display: block; font-size: 16px; color: #55ff55; font-weight: 600; letter-spacing: 5px; margin-top: 5px; text-transform: uppercase; }

        .menu-btn {
            width: 100%; padding: 14px; margin-top: 12px;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 12px; text-transform: uppercase;
        }
        .menu-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.96); }
        .menu-btn.green { background: linear-gradient(135deg, #2ecc71, #27ae60); border: none; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3); }

        /* Игровой HUD */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; z-index: 10; pointer-events: none; display: none; opacity: 0.8;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; border-radius: 2px;}
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        #pause-btn-hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 15; padding: 7px 20px; font-size: 12px; font-weight: bold; letter-spacing: 1px;
            background: var(--ui-bg); border: 1px solid var(--ui-border); color: #fff; border-radius: 20px;
            display: none; backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
        }

        /* Управление */
        #d-pad { position: absolute; bottom: 20px; left: 20px; z-index: 10; display: none; grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; gap: 8px; }
        #action-pad { position: absolute; bottom: 20px; right: 20px; z-index: 10; display: none; grid-template-columns: 60px 60px; gap: 12px; }

        .btn {
            background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 14px;
            color: #fff; display: flex; justify-content: center; align-items: center; font-size: 20px;
            backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur));
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }
        
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 3; }
        #btn-d { grid-column: 3; grid-row: 2; }
        
        .action-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 24px; }
        #btn-jump { grid-column: 1 / span 2; height: 45px; font-size: 13px; font-weight: bold; border-radius: 12px; }

        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: none; background: var(--ui-bg); padding: 5px; gap: 8px; border-radius: 16px;
            backdrop-filter: blur(var(--ui-blur)); -webkit-backdrop-filter: blur(var(--ui-blur)); border: 1px solid var(--ui-border);
        }
        .slot {
            width: 42px; height: 42px; background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; font-size: 22px; transition: all 0.2s ease;
        }
        .slot.active { border-color: #2ecc71; background: rgba(46, 204, 113, 0.2); transform: translateY(-3px); }
    </style>
</head>
<body>

    <div id="orientation-warning"><h2>Поверните телефон горизонтально</h2></div>

    <div id="main-menu" class="menu-overlay">
        <div class="menu-card">
            <div class="menu-title">MINE-WEB<br><span>Mobile Edition</span></div>
            <button class="menu-btn green" id="btn-start-game">Начать игру</button>
        </div>
    </div>

    <div id="pause-menu" class="menu-overlay">
        <div class="menu-card">
            <div class="menu-title">ПАУЗА</div>
            <button class="menu-btn green" id="btn-resume">Продолжить</button>
            <button class="menu-btn red" id="btn-exit-main" style="background:#c62828;">В главное меню</button>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="pause-btn-hud">|| ПАУЗА</div>
    <div id="game-canvas"></div>

    <div id="d-pad">
        <div id="btn-w" class="btn">▲</div>
        <div id="btn-a" class="btn">◀</div>
        <div id="btn-s" class="btn">▼</div>
        <div id="btn-d" class="btn">▶</div>
    </div>

    <div id="action-pad">
        <div id="btn-build" class="btn action-btn">🧱</div>
        <div id="btn-break" class="btn action-btn">🔨</div>
        <div id="btn-jump" class="btn">ПРЫЖОК</div>
    </div>

    <div id="hotbar">
        <div class="slot active" data-block="0">🟩</div>
        <div class="slot" data-block="1">🟫</div>
        <div class="slot" data-block="2">⬜</div>
        <div class="slot" data-block="3">🪵</div>
        <div class="slot" data-block="4">🍃</div>
        <div class="slot" data-block="5">🧱</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // === ЛОГИКА ОРИЕНТАЦИИ И ЭКРАНА ===
        function checkOrientation() {
            if (window.innerWidth < window.innerHeight) {
                document.getElementById('orientation-warning').classList.add('active');
            } else {
                document.getElementById('orientation-warning').classList.remove('active');
                window.dispatchEvent(new Event('resize'));
            }
        }
        window.addEventListener('DOMContentLoaded', checkOrientation);
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);

        function requestFullScreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) docElm.requestFullscreen();
            else if (docElm.webkitRequestFullScreen) docElm.webkitRequestFullScreen();
        }
        function exitFullScreen() {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }

        // === НАСТРОЙКИ СЦЕНЫ И ОПТИМИЗАЦИИ ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const renderDistance = 8; // Фиксированная дальность для ФПС
        scene.fog = new THREE.Fog(0x87CEEB, renderDistance, renderDistance + 2);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85); scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.3); sunLight.position.set(20, 50, 20); scene.add(sunLight);

        // === МАТЕРИАЛЫ И БЛОКИ ===
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const edgeGeo = new THREE.EdgesGeometry(blockGeometry);
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.3, transparent: true });

        const materialsMap = {
            0: [new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x5b9c31}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x866043})], // Трава
            1: Array(6).fill(new THREE.MeshLambertMaterial({color:0x866043})), // Земля
            2: Array(6).fill(new THREE.MeshLambertMaterial({color:0x7f8c8d})), // Камень
            3: [new THREE.MeshLambertMaterial({color:0xb07f35}), new THREE.MeshLambertMaterial({color:0xb07f35}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0x866043}), new THREE.MeshLambertMaterial({color:0xb07f35}), new THREE.MeshLambertMaterial({color:0xb07f35})], // Дерево
            4: Array(6).fill(new THREE.MeshLambertMaterial({color:0x2e7d32, transparent: true, opacity: 0.85})), // Листва
            5: Array(6).fill(new THREE.MeshLambertMaterial({color:0xc0392b}))  // Кирпич
        };

        let currentSelectedBlockType = 0;
        const worldBlocks = []; 

        function createBlock(x, y, z, type) {
            const mats = materialsMap[type];
            const block = new THREE.Mesh(blockGeometry, mats);
            block.position.set(x, y, z);
            const lines = new THREE.LineSegments(edgeGeo, edgeMat);
            block.add(lines);
            scene.add(block);
            worldBlocks.push(block);
        }

        // === ИСПРАВЛЕННАЯ ХОТБАР ЛОГИКА (ВСЕ 6 БЛОКОВ) ===
        const slots = document.querySelectorAll('.slot');
        slots.forEach(slot => {
            slot.addEventListener('touchstart', (e) => {
                e.preventDefault();
                slots.forEach(s => s.classList.remove('active'));
                slot.classList.add('active');
                currentSelectedBlockType = parseInt(slot.getAttribute('data-block'));
            });
        });

        // === ВОССТАНОВЛЕННАЯ ГЕНЕРАЦИЯ МИРА ===
        const generatedColumns = new Set();
        function generateChunks() {
            const pX = Math.round(camera.position.x);
            const pZ = Math.round(camera.position.z);
            let blocksAdded = 0;
            for(let x = pX - renderDistance; x <= pX + renderDistance; x++) {
                for(let z = pZ - renderDistance; z <= pZ + renderDistance; z++) {
                    if (Math.hypot(x - pX, z - pZ) <= renderDistance) {
                        const colKey = `${x},${z}`;
                        if(!generatedColumns.has(colKey)) {
                            generatedColumns.add(colKey);
                            createBlock(x, 0, z, 0); blocksAdded++; // Трава
                            if(blocksAdded > 8) return; // Плавная генерация без лагов
                        }
                    }
                }
            }
        }

        // === ВОССТАНОВЛЕННАЯ КАМЕРА (МУЛЬТИТАЧ) ===
        let isDragging = false;
        let prevTouchX = 0, prevTouchY = 0;
        const canvasZone = document.getElementById('game-canvas');

        canvasZone.addEventListener('touchstart', (e) => {
            isDragging = true; prevTouchX = e.touches[0].clientX; prevTouchY = e.touches[0].clientY;
        });

        canvasZone.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - prevTouchX;
            const deltaY = e.touches[0].clientY - prevTouchY;
            if (Math.abs(deltaX) < 100 && Math.abs(deltaY) < 100) {
                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, camera.rotation.x));
            }
            prevTouchX = e.touches[0].clientX; prevTouchY = e.touches[0].clientY;
        });
        canvasZone.addEventListener('touchend', () => isDragging = false);

        // === ВОССТАНОВЛЕННАЯ ФИЗИКА, ХОДЬБА И СПАВН ===
        const moveState = { forward: false, backward: false, left: false, right: false };
        let playerVelocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;
        const jumpForce = 0.22;
        const speed = 0.09;
        
        const playerRadius = 0.3;
        const playerHeight = 1.8; 
        camera.position.set(0, 2.0, 0); // ИСПРАВЛЕННЫЙ СПАВН НА ЗЕМЛЕ (высота глаз 2 блока)

        function bindControl(id, action) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[action] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); moveState[action] = false; });
            el.addEventListener('touchcancel', (e) => { e.preventDefault(); moveState[action] = false; });
        }
        bindControl('btn-w', 'forward'); bindControl('btn-s', 'backward');
        bindControl('btn-a', 'left'); bindControl('btn-d', 'right');

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { playerVelocityY = jumpForce; isGrounded = false; }
        });

        // Функция проверки коллизий
        function checkCollisions(targetPos) {
            const pMinX = targetPos.x - playerRadius, pMaxX = targetPos.x + playerRadius;
            const pMinZ = targetPos.z - playerRadius, pMaxZ = targetPos.z + playerRadius;
            const pMinY = targetPos.y - playerHeight + 0.05, pMaxY = targetPos.y; 

            for (let i = 0; i < worldBlocks.length; i++) {
                const b = worldBlocks[i].position;
                if (Math.abs(b.x - targetPos.x) < 1.1 && Math.abs(b.z - targetPos.z) < 1.1 && Math.abs(b.y - (targetPos.y - 1.0)) < 1.5) {
                    const boxMinX = b.x - 0.5, boxMaxX = b.x + 0.5;
                    const boxMinZ = b.z - 0.5, boxMaxZ = b.z + 0.5;
                    const boxMinY = b.y - 0.5, boxMaxY = b.y + 0.5;
                    
                    if (pMinX < boxMaxX && pMaxX > boxMinX && pMinZ < boxMaxZ && pMaxZ > boxMinZ && pMinY < boxMaxY && pMaxY > boxMinY) {
                        return true; 
                    }
                }
            }
            return false;
        }

        // === ВОССТАНОВЛЕННОЕ СТРОИТЕЛЬСТВО / РАЗРУШЕНИЕ ===
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        document.getElementById('btn-break').addEventListener('touchstart', (e) => {
            e.preventDefault();
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(worldBlocks);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const b = intersects[0].object;
                if(b.position.y === 0 && blocksAt(b.position.x, b.position.z) <= 1) return; // Запрещаем ломать пол
                scene.remove(b);
                worldBlocks.splice(worldBlocks.indexOf(b), 1);
            }
        });

        function blocksAt(x, z) {
            return worldBlocks.filter(b => b.position.x === x && b.position.z === z).length;
        }

        document.getElementById('btn-build').addEventListener('touchstart', (e) => {
            e.preventDefault();
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(worldBlocks);
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const spawnPos = new THREE.Vector3().copy(intersects[0].object.position).add(intersects[0].face.normal);
                // Проверка коллизии нового блока с игроком
                const pMinX = camera.position.x - playerRadius, pMaxX = camera.position.x + playerRadius;
                const pMinZ = camera.position.z - playerRadius, pMaxZ = camera.position.z + playerRadius;
                const pMinY = camera.position.y - playerHeight, pMaxY = camera.position.y;
                const bMinX = spawnPos.x - 0.5, bMaxX = spawnPos.x + 0.5;
                const bMinY = spawnPos.y - 0.5, bMaxY = spawnPos.y + 0.5;
                const bMinZ = spawnPos.z - 0.5, bMaxZ = spawnPos.z + 0.5;

                if (!(pMinX < bMaxX && pMaxX > bMinX && pMinZ < bMaxZ && pMaxZ > bMinZ && pMinY < bMaxY && pMaxY > bMinY)) {
                    createBlock(spawnPos.x, spawnPos.y, spawnPos.z, currentSelectedBlockType);
                }
            }
        });

        // === МЕНЕДЖЕР ЭКРАНОВ ===
        function toggleUI(inGame) {
            const state = inGame ? 'block' : 'none';
            document.getElementById('main-menu').style.display = inGame ? 'none' : 'flex';
            document.getElementById('game-canvas').style.display = state;
            document.getElementById('crosshair').style.display = state;
            document.getElementById('pause-btn-hud').style.display = state;
            document.getElementById('d-pad').style.display = inGame ? 'grid' : 'none';
            document.getElementById('action-pad').style.display = inGame ? 'grid' : 'none';
            document.getElementById('hotbar').style.display = inGame ? 'flex' : 'none';
            if(inGame) setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
        }

        document.getElementById('btn-start-game').addEventListener('click', () => { requestFullScreen(); toggleUI(true); });
        document.getElementById('pause-btn-hud').addEventListener('click', () => { toggleUI(false); });
        document.getElementById('btn-resume').addEventListener('click', () => { requestFullScreen(); toggleUI(true); });
        document.getElementById('btn-exit-main').addEventListener('click', () => { exitFullScreen(); toggleUI(false); });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === ИГРОВОЙ ЦИКЛ ===
        const moveDir = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            if(!isGameRunning) return;

            generateChunks();

            // 1. Физика
            playerVelocityY += gravity;
            camera.position.y += playerVelocityY;

            let groundY = 2.0; // Высота спавна h=0 + h игроков глаз = 2.0
            
            // Находим блок под ногами
            for(let i=0; i<worldBlocks.length; i++) {
                let b = worldBlocks[i].position;
                if (Math.abs(b.x - camera.position.x) < 0.65 && Math.abs(b.z - camera.position.z) < 0.65) {
                    if (b.y + 1.8 > groundY && camera.position.y >= b.y + 1.7) {
                        groundY = b.y + 2.0; // Новая высота пола
                    }
                }
            }

            if (camera.position.y <= groundY) {
                camera.position.y = groundY;
                playerVelocityY = 0;
                isGrounded = true;
            }

            // 2. Ходьба
            moveDir.set(0, 0, 0);
            if (moveState.forward) moveDir.z -= 1;
            if (moveState.backward) moveDir.z += 1;
            if (moveState.left) moveDir.x -= 1;
            if (moveState.right) moveDir.x += 1;

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize();
                moveDir.applyEuler(new THREE.Euler(0, camera.rotation.y, 0));
                
                let testPosX = camera.position.clone().addScaledVector(new THREE.Vector3(moveDir.x, 0, 0), speed);
                if (!checkCollisions(testPosX)) camera.position.x = testPosX.x;
                
                let testPosZ = camera.position.clone().addScaledVector(new THREE.Vector3(0, 0, moveDir.z), speed);
                if (!checkCollisions(testPosZ)) camera.position.z = testPosZ.z;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
